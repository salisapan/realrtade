<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Choose a file — Glance</title>
<style>
  :root{
    --paper:#F5F7FB; --ink:#0B0F1A; --ink-3:#6B7488; --accent:#1A4EF5; --err:#B3261E;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#07090F; --ink:#E9EDF6; --ink-3:#7E889C; --accent:#3B74FF; --err:#FF8A80; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .state{ padding:24px; text-align:center; font-size:14px; color:var(--ink-3); max-width:320px }
  .state.err{ color:var(--err) }
  .spin{
    width:22px; height:22px; margin:0 auto 12px; border-radius:50%;
    border:2px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-top-color:var(--accent); animation:spin .8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .spin{ animation:none } }
  @keyframes spin{ to{ transform:rotate(360deg) } }
</style>
</head>
<body>
  <div id="status" class="state"><div class="spin" aria-hidden="true"></div>Connecting to Google Drive…</div>
  <script src="picker.js"></script>
</body>
</html>
