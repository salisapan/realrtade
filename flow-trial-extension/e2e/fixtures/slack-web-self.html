<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sali Sapan (you) - Slack</title></head>
<body>
<div class="p-message_pane__header">
  <button type="button" data-qa="channel_name">Sali Sapan <span class="p-view_header__channel_title_suffix">(you)</span></button>
</div>
<div class="p-view_contents p-view_contents--primary" data-qa="message_pane" role="main">
  <div class="c-virtual_list" role="list" aria-label="Sali Sapan (you)">
    <div data-qa="virtual-list-item" class="c-virtual_list__item" role="listitem">
      <div class="c-message_kit__message" data-qa="message_container" data-msg-ts="1732100000.000100">
        <button type="button" class="c-message__sender" data-qa="message_sender_name">Sali Sapan</button>
        <div data-qa="message-text" class="c-message_kit__text">
          <div class="p-rich_text_section">Can you send the invoice by Friday?</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="c-texty_input_unstyled" data-qa="message_input">
  <div class="ql-editor" contenteditable="true" role="textbox" aria-label="Message yourself" data-placeholder="Jot something down"></div>
</div>
<button type="button" data-qa="texty_send_button" aria-label="Send now" onclick="window.__glanceSendClicks=(window.__glanceSendClicks||0)+1"></button>
</body>
</html>
