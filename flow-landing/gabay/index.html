function Field(props) {
  return (
    <div className={props.wide ? "form wide" : "form"}>
      {props.rows.map(function (r) {
        return (
          <React.Fragment key={r[0]}>
            <div className="lab">{r[0]}</div>
            <div>{r[1]}</div>
          </React.Fragment>
        );
      })}
    </div>
  );
}
function Win(props) {
  return (
    <section className={"dwin " + props.cls} aria-label={props.sys}>
      <div className="dtb">
        <span className="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span className="dtt">{props.sys}{props.sub ? " · " + props.sub : ""}</span>
      </div>
      {props.menu ? <div className="menu">{props.menu.map(function (m) { return <span key={m}>{m}</span>; })}</div> : null}
      <div className="dbody">{props.children}</div>
    </section>
  );
}
function Mast(props) {
  return (
    <p className="mast"><b>{props.sys}.</b> {props.what} <em>ממתין: {props.wait}</em></p>
  );
}
function FileState(props) {
  const s = props.step;
  const rows = [
    ["עתיד", s < 3 ? "טיוטה" : C.atid],
    ["אלמגור", s < 4 ? "לא קיים" : C.alg],
    ["פוליוויז", s < 4 ? "—" : C.pw],
    ["מסלקה", s < 11 ? "לא הוזמנה" : C.ms],
  ];
  return (
    <div className="fstate" aria-label="מצב התיק">
      {rows.map(function (r) {
        return <span key={r[0]}>{r[0]} <b className="num">{r[1]}</b></span>;
      })}
    </div>
  );
}
function Chain(props) {
  const step = props.step;
  return (
    <div className="chain2" aria-label="שלבי הטיפול">
      {PHASES.map(function (p, i) {
        const done = step > p.b;
        const cur = step >= p.a && step <= p.b;
        const cls = done ? "lit" : cur ? "cur" : "";
        return (
          <React.Fragment key={p.t}>
            <button type="button" className={"cn2 " + cls} disabled={step < p.a} onClick={function () { if (step >= p.a) props.go(p.a); }}>{p.t}</button>
            {i < PHASES.length - 1 ? <span className="ca2">←</span> : null}
          </React.Fragment>
        );
      })}
    </div>
  );
}
function Appendix() {
  return (
    <details className="appx">
      <summary>נספח: מעקב מול הנוהל</summary>
      <div className="inn">
        <p>הטבלה ממפה את חמשת שלבי הנוהל, את חמש ההערות שדרסו אותו, ואת שורות השקופית אל מסכי הטיפול. היא לא חלק ממסכי העבודה.</p>
        <div className="tbl">
          <table>
            <thead><tr><th>מקור</th><th>שורה</th><th>מסך</th><th>הערה</th></tr></thead>
            <tbody>
              {APPENDIX.map(function (r, i) {
                return <tr key={i}><td>{r[0]}</td><td>{r[1]}</td><td>{r[2]}</td><td>{r[3]}</td></tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>
    </details>
  );
}

  if (step === 11) return (
    <div className="two">
      <Win cls="alg" sys="אלמגור" sub={"הזמנת מסלקה · " + C.alg} menu={["לקוח", "מסלקה", "הזמנות"]}>
        <Mast sys="אלמגור" what="ההרשאה למסלקה חתומה ומתויקת. ההזמנה מוכנה על הלקוח הקיים ולא יצאה." wait="שידור ההזמנה מאלמגור" />
        <Field rows={[
          ["הזמנה", <span className="num" key="ms">{C.ms}</span>],
          ["לקוח", C.who + " · " + C.alg],
          ["ת״ז", <span className="num" key="id">{C.id}</span>],
          ["הרשאה", "חתומה 13.10.2026, בתיק"],
          ["סטטוס", "מוכנה. לא שודרה"],
        ]} />
        <p className="fine">אחרי השידור הקבצים עולים ללקוח. אם הלקוח לא היה קיים, אותם קבצים היו פותחים גם אותו.</p>
      </Win>
      <Win cls="crm" sys="עתיד" sub={C.atid + " · ממשקים"} menu={["ממשקים"]}>
        <div className="lock"><span>הזמנת מסלקה מתוך עתיד</span><b>חסום</b></div>
        <p className="fine">ההזמנה יוצאת מאלמגור בלבד. אין ממשק שמעביר את הקובץ מעתיד.</p>
      </Win>
    </div>
  );

  if (step === 12) return (
    <Win cls="alg" sys="אלמגור" sub={C.alg + " · " + C.who} menu={["לקוח", "משפחה", "תוכניות", "מסמכים"]}>
      <Mast sys="אלמגור" what={"הזמנה " + C.ms + " חזרה ב־16.10.2026 08:40. התוכניות נפתחו מהקובץ. קבצי טרום הייעוץ בתיק. אין כאן שליחה."} wait="אין שליחה במסך הזה. האישור הבא הוא קביעת המועד" />
      <div className="tbl"><table>
        <thead><tr><th>תוכנית שנפתחה</th><th>מקור</th><th>צבירה</th></tr></thead>
        <tbody>
          <tr><td>פנסיה מקיפה · מנורה · <span className="num">77190214</span></td><td>קובץ מסלקה</td><td>18,400 ש״ח</td></tr>
          <tr><td>ביטוח מנהלים קודם · כלל · <span className="num">90331127</span></td><td>קובץ מסלקה</td><td>6,200 ש״ח</td></tr>
        </tbody>
      </table></div>
      <div className="tbl"><table>
        <thead><tr><th>קובץ שחזר</th><th>סוג</th><th>בתיק</th></tr></thead>
        <tbody>
          <tr><td className="num">MS-551902_314552191.pdf</td><td>קובץ מסלקה</td><td>נקלט</td></tr>
          <tr><td>טרום ייעוץ — פנסיה מקיפה.pdf</td><td>טרום ייעוץ</td><td>בתיק</td></tr>
          <tr><td>טרום ייעוץ — ביטוח מנהלים.pdf</td><td>טרום ייעוץ</td><td>בתיק</td></tr>
        </tbody>
      </table></div>
      <p className="fine">{C.q2}, ת״ז <span className="num">{C.q2id}</span>, לא פתוחה באלמגור. קובץ מסלקה על הת״ז שלה היה פותח גם את הלקוח וגם את התוכניות. אצל {C.who} הלקוח כבר היה קיים, אז נפתחו התוכניות בלבד.</p>
      <p className="fine">התיק מלא: צילום ת״ז, שלוש הרשאות, אקסל הר הביטוח, שלוש פוליסות בשם שאושר, תוכניות, וקבצי טרום ייעוץ.</p>
    </Win>
  );

  if (step === 13) return (
    <Win cls="ag" sys={"יומן " + C.agent} sub="נובמבר 2026 · בקשת דחייה" menu={["יומן", "פגישות", "זמינות"]}>
      <Mast sys={"יומן " + C.agent} what={C.coord + " חזרה אל " + C.who + " לקבוע. הוא ענה ב־19.10.2026: «שלישי בבוקר לא מסתדר. אפשר חמישי?» המועד הישן ירד. הזימון עדיין לא נשלח."} wait="אישור המועד החלופי" />
      <div className="tbl"><div className="cal">
        <div className="h">א׳ 8.11</div><div className="h">ב׳ 9.11</div><div className="h">ג׳ 10.11</div><div className="h">ד׳ 11.11</div><div className="h">ה׳ 12.11</div>
        <div>חסום</div><div>14:00 תפוס</div><div><span className="old">09:00 הוצע ובוטל</span></div><div>פנוי אחה״צ</div><div className="neu">10:30 פנוי</div>
      </div></div>
      <Field wide rows={[
        ["מועד חדש", C.slot],
        ["מקום", C.room],
        ["סוג", "פגישת קליטה — הסדר פנסיוני"],
        ["סוכן", C.agent],
      ]} />
    </Win>
  );

  if (step === 14) return (
    <Win cls="ag" sys="זימון" sub="טיוטה · מיומן הסוכן אל מייל הלקוח" menu={["יומן", "זימון", "קבצים"]}>
      <Mast sys={"יומן " + C.agent} what="הזימון בנוי ולא נשלח. הקבצים מצורפים בשמות שאושרו בסריקה, כדי שהסוכן ידע מה כל קובץ בלי לפתוח אותו." wait="שליחת הזימון" />
      <Field rows={[
        ["מאת", C.agent + " · " + C.agency],
        ["אל", C.who],
        ["מתאמת", C.coord],
        ["נושא", "פגישת קליטה — הסדר פנסיוני"],
        ["מתי", C.slot],
        ["איפה", C.room],
      ]} />
      <div className="tbl"><table>
        <thead><tr><th>קובץ מצורף</th><th>מה הסוכן רואה</th></tr></thead>
        <tbody>
          <tr><td>הראל 44821093.pdf</td><td>פוליסת בריאות</td></tr>
          <tr><td>מנורה 77190214.pdf</td><td>פוליסת פנסיה</td></tr>
          <tr><td>מגדל 22018455.pdf</td><td>אובדן כושר</td></tr>
          <tr><td>דוח פוליוויז — {C.who}.pdf</td><td>דוח מרכז</td></tr>
          <tr><td>הר הביטוח — {C.who}.xlsx</td><td>אקסל הר הביטוח</td></tr>
          <tr><td>טרום ייעוץ — פנסיה מקיפה.pdf</td><td>טרום ייעוץ</td></tr>
        </tbody>
      </table></div>
    </Win>
  );

  if (step === 15) return (
    <Win cls="wa" sys="וואטסאפ" sub={"טיוטה אל " + C.who + " · לא נשלחה"}>
      <Mast sys="וואטסאפ" what={"התזכורת נקבעה ליום שלפני הפגישה, " + C.remind + ". זו שעת ה־X שסוכמה בתיק. אחרי האישור זו שליחה בתוך ההדגמה, לא חיבור לוואטסאפ."} wait="אישור התזכורת" />
      <div className="wa">
        <div className="bar">{C.who}</div>
        <div className="bub">
          שלום {C.first}, תזכורת: מחר {C.slot}, {C.room}. זו פגישת קליטה להסדר פנסיוני עם {C.agent}. נתראה.
          <time>{C.remind} · טיוטה</time>
        </div>
      </div>
      <p className="fine">אין בתיק מספר טלפון. המועד, המקום וסוג הפגישה כתובים בהודעה.</p>
    </Win>
  );

  return (
    <div>
      <div className="recap">
        <section className="rc">
          <h3>מה Flow הבין</h3>
          <p>הודעת מעסיק על {C.who}, ת״ז <span className="num">{C.id}</span>, מ{C.emp}, בלי טפסים חתומים.</p>
          <p>{C.q2} ו{C.q3} נשארים בתור.</p>
          <p>שלוש הרשאות נחתמות מפוליוויז. המסלקה מוזמנת מאלמגור. הזימון יוצא מיומן {C.agent}.</p>
        </section>
        <section className="rc e">
          <h3>מה Flow ביצע, באישור</h3>
          <p>נפתח {C.atid} ותויקה ת״ז. שדר פתיחה פתח {C.alg}.</p>
          <p>יצא לינק {C.pw}, ואחריו שתי תזכורות: פרטים חסרים, ואז הרשאה חסרה.</p>
          <p>תויקו שלוש הרשאות, אקסל הר הביטוח, ושלוש פוליסות בשם שאושר. הוזמנה {C.ms} ונפתחו שתי תוכניות.</p>
          <p>אושר {C.slot}, נשלח זימון, ואושרה תזכורת ל־{C.remind}.</p>
        </section>
        <section className="rc l">
          <h3>מה נשאר אצל שירה</h3>
          <p>השיחה שמסבירה לאורי מה נדרש לפגישה.</p>
          <p>כל אישור לפני שליחה, תיוק, שידור וזימון. בלי האישור הרשומה נשארת טיוטה.</p>
          <p>אין במסך חיבור חי למערכות.</p>
        </section>
      </div>
      <Win cls="log" sys="יומן הטיפול" sub={C.who + " · " + C.atid + " · " + C.alg}>
        <Mast sys="התיק" what="כל השליחות, החתימות והזימון יצאו רק אחרי אישור של שירה. המערכות שמופיעות כאן לא מחוברות באמת." wait="אין פעולה פתוחה" />
        <div className="tbl"><table>
          <thead><tr><th>מתי</th><th>מערכת</th><th>מה אושר</th></tr></thead>
          <tbody>
            {TRAIL.map(function (t, i) { return <tr key={i}><td className="num">{t[0]}</td><td>{t[1]}</td><td>{t[2]}</td></tr>; })}
          </tbody>
        </table></div>
        <h2 style={{ fontFamily: "Heebo, Assistant, sans-serif", fontSize: 16, margin: "12px 0 4px" }}>הערכת זמן, לא מדידה</h2>
        <div className="tbl"><table>
          <thead><tr><th>שורה</th><th>זמן</th><th>מה זה</th></tr></thead>
          <tbody>
            <tr><td>טיפול ידני משוער לעובד אחד, כולל שלושת הסבבים</td><td>כ־50 דק׳</td><td>המחשה</td></tr>
            <tr><td>זמן המתאמת בהדגמה: האישורים, לא המעבר בין המערכות</td><td>כ־12 דק׳</td><td>המחשה</td></tr>
            <tr><td>ההפרש לעובד</td><td>כ־38 דק׳</td><td>המחשה. לא נמדד בסוכנות גבאי ולא הבטחה</td></tr>
          </tbody>
        </table></div>
        <p className="fine">פריסה: Flow Edge על שרתי הסוכנות, או ענן מוסווה. שתיהן זמינות. אין כאן SSO, אין יומן ביקורת, ואין חיבור אמיתי לעתיד, לאלמגור, לפוליוויז, ליומן או לוואטסאפ.</p>
      </Win>
    </div>
  );
}

function App() {
  const q0 = parseInt(new URLSearchParams(location.search).get("step") || "0", 10);
  const [step, setStep] = useState(isNaN(q0) ? 0 : Math.max(0, Math.min(LAST, q0)));
  const live = useRef(null);
  useEffect(function () {
    var b = document.getElementById("boot-status"); if (b) b.style.display = "none";
  }, []);
  useEffect(function () {
    var u = new URL(location.href);
    if (step === 0) u.searchParams.delete("step"); else u.searchParams.set("step", String(step));
    history.replaceState(null, "", u.pathname + u.search);
    if (live.current) live.current.textContent = step === 0 ? "תפריט" : STEPS[step - 1].t;
    scrollTo(0, 0);
  }, [step]);
  function go(n) { setStep(n); }
  function next() { setStep(function (s) { return Math.min(LAST, s + 1); }); }
  function back() { setStep(function (s) { return Math.max(0, s - 1); }); }

  return (
    <div className="app">
      <style>{CSS}</style>
      <div className="sr" ref={live} aria-live="polite" />
      <div className="wrap">
        <header className="hd">
          <div className="hd-brand">
            <img className="flow" src={LOGO} alt="Flow" />
            <span className="hd-x">×</span>
            <span className="hd-name">{C.agency}</span>
          </div>
          {step === 0 ? <span className="badge">הדמיית קונספט</span> : <button type="button" className="hd-btn" onClick={function () { go(0); }}>לתפריט</button>}
        </header>

        {step === 0 ? (
          <div className="lc">
            <h1>Flow × {C.agency}</h1>
            <p className="lead">Flow לומד את נוהל תאום הפגישה לעובד חדש, מכין את הרשומה במערכות הסוכנות, ועוצר לפני כל שליחה, חתימה וזימון. {C.coord} מאשרת בכפתור אישור. בלי האישור הרשומה נשארת טיוטה.</p>
            <div className="method" aria-label="איך Flow עובד">
              <span className="mstep"><i>1</i>מזהה את הכוונה</span>
              <span className="marr">←</span>
              <span className="mstep"><i>2</i>מכין את הרשומה</span>
              <span className="marr">←</span>
              <span className="mstep"><i>3</i>מבצע באישור</span>
            </div>
            <div className="facts">
              <div className="lab">עובד לטיפול</div><div>{C.who} · ת״ז <span className="num">{C.id}</span></div>
              <div className="lab">מעסיק</div><div>{C.emp} · ח.פ <span className="num">{C.empId}</span></div>
              <div className="lab">מתאמת</div><div>{C.coord}</div>
              <div className="lab">סוכן ששובץ</div><div>{C.agent}</div>
              <div className="lab">משפחה</div><div>{C.spouse} · {C.child}</div>
              <div className="lab">בתור, לא בטיפול</div><div>{C.q2} · {C.q3}</div>
            </div>
            <div className="start">
              <div>
                <h2>תאום פגישה לעובד חדש</h2>
                <p>{C.coord} · {C.who} · עתיד, אלמגור, פוליוויז, יומן ווואטסאפ</p>
              </div>
              <button type="button" className="doit" onClick={function () { go(1); }}>אישור</button>
            </div>
            <div className="proc">
              <h2>נוהל הטיפול</h2>
              <ol>
                <li>הודעה מהמעסיק: מהנייד או מהמייל, בגוף ההודעה או כקובץ, על אדם אחד או על רשימה.</li>
                <li>פתיחה בעתיד, תיוק צילום ת״ז, ושדר לאלמגור עם המשפחה. אין טפסים חתומים מהמעסיק.</li>
                <li>שלוש הרשאות נחתמות רק דרך פוליוויז: מסלקה, הר הביטוח, העתקי פוליסות. הלינק לא יוצא מעתיד.</li>
                <li>העתקי הפוליסות נסרקים לשדר. שם הקובץ: חברת הביטוח ומספר הפוליסה.</li>
                <li>הזמנת המסלקה מאלמגור בלבד. הקבצים פותחים את התוכניות, ואם הלקוח חסר — גם אותו. נוספים קבצי טרום ייעוץ.</li>
                <li>כשהתיק מלא: זימון מיומן הסוכן אל מייל הלקוח, עם הקבצים בשמם. תזכורת בוואטסאפ יום לפני, או X זמן לפני.</li>
              </ol>
            </div>
            <p className="note">פריסה אפשרית: Flow Edge על שרתי הסוכנות, או ענן מוסווה. שתיהן זמינות. אין במסך הזה SSO ואין יומן ביקורת. הזמנים ביומן הטיפול הם המחשה, לא מדידה. השמות בדויים, ואין בתיק מספר טלפון.</p>
          </div>
        ) : (
          <div className="stage">
            <div className="wf-top">
              <div>
                <div className="wf-cat">תאום פגישה לעובד חדש · מסך {step} מתוך {LAST}</div>
                <h1>{STEPS[step - 1].t}</h1>
              </div>
              <div className="persona">{C.coord} · מתאמת · {C.who}</div>
            </div>
            <FileState step={step} />
            {screenBody(step)}
            {step < 16 ? (
              <div className="pill2" data-approval="1">
                <div className="ptx"><small>Flow זיהה</small><b>{WAITS[step]}</b></div>
                <div className="acts">
                  <button type="button" className="ghost" onClick={back}>מסך קודם</button>
                  <button type="button" className="doit" onClick={next}>אישור</button>
                </div>
              </div>
            ) : (
              <div className="endacts">
                <button type="button" className="ghost" onClick={back}>מסך קודם</button>
                <button type="button" className="ghost" onClick={function () { go(1); }}>מההתחלה</button>
                <button type="button" className="ghost" onClick={function () { go(0); }}>לתפריט</button>
              </div>
            )}
            <Chain step={step} go={go} />
            <p className="cap">{CAPS[step]}</p>
          </div>
        )}

        <Appendix />
        <div className="foot">הדמיית קונספט · נתונים בדויים · אין חיבור חי לעתיד, לאלמגור, לפוליוויז, ליומן או לוואטסאפ</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
