<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribed — Glance</title>
<link rel="stylesheet" href="/assets/fonts/corner/fonts.css">
<link rel="stylesheet" href="/glance/glance.css">
<script>
(function () {
  var lang = 'en';
  try { lang = localStorage.getItem('flow_lang') === 'he' ? 'he' : 'en'; } catch (e) {}
  var theme = 'light';
  try { theme = localStorage.getItem('glance_theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body class="corner-v24">
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="/"><img src="/logo-header.png" width="177" height="78" alt="Flow"></a>
    <nav class="links" id="primaryNav" aria-label="Primary">
      <a href="/glance/?source=nav" data-nav="glance">Glance</a>
    </nav>
    <div class="tools">
      <button class="tool" id="langBtn" type="button" aria-label="Language">EN</button>
      <button class="tool icon" id="themeBtn" type="button" aria-label="Dark mode" aria-pressed="false">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
      </button>
      <button class="tool menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="primaryNav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="main">
  <div class="wrap">
    <p class="eyebrow">Glance</p>
    <h1 data-i18n="h1">You’re unsubscribed</h1>
    <p class="lede" data-i18n="body">Product updates will stop. Your Terms acceptance stays on record until you ask us to delete it. <bdi>Glance</bdi> itself is unchanged.</p>
    <p class="soon"><a href="/glance/" data-i18n="back">Back to Glance</a></p>
  </div>
</main>
<script>
window.FLOW_PAGE_I18N = {
  h1: { en: 'You’re unsubscribed', he: 'העדכונים הופסקו' },
  body: {
    en: 'Product updates will stop. Your Terms acceptance stays on record until you ask us to delete it. <bdi>Glance</bdi> itself is unchanged.',
    he: 'עדכוני המוצר ייפסקו. אישור התנאים נשאר רשום עד שתבקשו למחוק אותו. <bdi>Glance</bdi> עצמה לא משתנה.'
  },
  back: { en: 'Back to Glance', he: 'חזרה ל-Glance' }
};
</script>
<script src="/glance/gate.js" defer></script>
<script src="/assets/site-nav.js" defer></script>
</body>
</html>
