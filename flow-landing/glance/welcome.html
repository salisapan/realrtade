<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Glance</title>
<link rel="stylesheet" href="/assets/fonts/corner/fonts.css">
<link rel="stylesheet" href="/glance/glance.css">
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var lang = q.get('lang') === 'he' || q.get('lang') === 'en' ? q.get('lang') : '';
  if (!lang) {
    try { lang = localStorage.getItem('flow_lang') === 'he' ? 'he' : 'en'; } catch (e) { lang = 'en'; }
  } else {
    try { localStorage.setItem('flow_lang', lang); } catch (e) {}
  }
  var theme = q.get('theme') === 'dark' || q.get('theme') === 'light' ? q.get('theme') : '';
  if (!theme) {
    try { theme = localStorage.getItem('glance_theme') === 'dark' ? 'dark' : 'light'; } catch (e) { theme = 'light'; }
  }
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body class="corner-v24">
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="/"><img src="/logo-header.png" width="177" height="78" alt="Flow"></a>
    <nav class="links" aria-label="Primary">
      <a href="/glance/?source=nav" data-nav="glance">Glance</a>
    </nav>
    <div class="tools">
      <button class="tool" id="langBtn" type="button" aria-label="Language">EN</button>
      <button class="tool" id="themeBtn" type="button">Dark</button>
    </div>
  </div>
</header>
<main id="main">
  <div class="wrap" id="welcome">
    <p class="eyebrow">Glance</p>
    <section id="stateConnected" hidden>
      <h1 id="connectedTitle">Connected as you@company.com</h1>
      <p class="lede" data-i18n="choose">Choose what <bdi>Glance</bdi> can see. You can change it later.</p>
      <ul class="ecos">
        <li>
          <label class="step-row check-row">
            <input type="checkbox" checked data-eco>
            <span><strong><bdi>Microsoft</bdi></strong><span class="scope" data-i18n="msScope"><bdi>Outlook</bdi>, <bdi>Calendar</bdi>, and <bdi>Teams</bdi>. Prepares the close. You approve it.</span></span>
          </label>
        </li>
        <li>
          <label class="step-row check-row">
            <input type="checkbox" checked data-eco>
            <span><strong><bdi>Google</bdi></strong><span class="scope" data-i18n="ggScope"><bdi>Gmail</bdi>, <bdi>Calendar</bdi>, and <bdi>Drive</bdi>. Prepares the close. You approve it.</span></span>
          </label>
        </li>
        <li>
          <label class="step-row check-row">
            <input type="checkbox" checked data-eco>
            <span><strong><bdi>Meta</bdi></strong><span class="scope" data-i18n="metaScope"><bdi>WhatsApp</bdi>. Prepares the close. You approve it.</span></span>
          </label>
        </li>
      </ul>
      <button class="doit" id="connectAll" type="button" data-i18n="connectAll">Connect all</button>
    </section>
    <section id="stateUnknown" hidden>
      <h1 data-i18n="unknownTitle">We didn’t recognize your email</h1>
      <p class="lede" data-i18n="unknownBody">Send a magic link and we’ll open <bdi>Glance</bdi> in this browser.</p>
      <form id="magicForm" class="gate" novalidate>
        <div class="field">
          <label class="step-row" for="magicEmail">
            <span class="step-k" data-i18n="emailLabel">Email</span>
            <input id="magicEmail" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" required placeholder="you@company.com">
          </label>
          <p class="gate-hint" id="magicHint" hidden></p>
        </div>
        <button class="doit" id="magicSubmit" type="submit" disabled data-i18n="magicBtn">Send magic link</button>
      </form>
    </section>
    <section id="stateInbox" hidden>
      <h1 data-i18n="inboxTitle">Check your inbox</h1>
      <p class="lede" id="inboxBody">We sent a link to you@company.com. It expires in 15 minutes.</p>
    </section>
  </div>
</main>
<script>
window.FLOW_PAGE_I18N = {
  choose: {
    en: 'Choose what <bdi>Glance</bdi> can see. You can change it later.',
    he: 'בחרו מה <bdi>Glance</bdi> יכול לראות. אפשר לשנות אחר כך.'
  },
  msScope: {
    en: '<bdi>Outlook</bdi>, <bdi>Calendar</bdi>, and <bdi>Teams</bdi>. Prepares the close. You approve it.',
    he: '<bdi>Outlook</bdi>, <bdi>Calendar</bdi>, ו-<bdi>Teams</bdi>. מכין את הסגירה. אתם מאשרים.'
  },
  ggScope: {
    en: '<bdi>Gmail</bdi>, <bdi>Calendar</bdi>, and <bdi>Drive</bdi>. Prepares the close. You approve it.',
    he: '<bdi>Gmail</bdi>, <bdi>Calendar</bdi>, ו-<bdi>Drive</bdi>. מכין את הסגירה. אתם מאשרים.'
  },
  metaScope: {
    en: '<bdi>WhatsApp</bdi>. Prepares the close. You approve it.',
    he: '<bdi>WhatsApp</bdi>. מכין את הסגירה. אתם מאשרים.'
  },
  connectAll: { en: 'Connect all', he: 'חברו הכול' },
  unknownTitle: { en: 'We didn’t recognize your email', he: 'לא זיהינו את האימייל' },
  unknownBody: {
    en: 'Send a magic link and we’ll open <bdi>Glance</bdi> in this browser.',
    he: 'שלחו קישור כניסה ונפתח את <bdi>Glance</bdi> בדפדפן הזה.'
  },
  emailLabel: { en: 'Email', he: 'אימייל' },
  magicBtn: { en: 'Send magic link', he: 'שלחו קישור כניסה' },
  inboxTitle: { en: 'Check your inbox', he: 'בדקו את תיבת הדואר' },
  connectedAs: { en: 'Connected as {email}', he: 'מחובר כ-{email}' },
  inboxBody: {
    en: 'We sent a link to {email}. It expires in 15 minutes.',
    he: 'שלחנו קישור אל {email}. הוא פג אחרי 15 דקות.'
  },
  invalid: { en: 'Enter a valid email.', he: 'הזינו אימייל תקין.' }
};
window.GlanceWelcome = function (root) {
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var q = new URLSearchParams(location.search);
  var state = q.get('state');
  if (state !== 'connected' && state !== 'unknown' && state !== 'inbox') state = 'unknown';
  var address = q.get('email') || 'you@company.com';
  var connected = document.getElementById('stateConnected');
  var unknown = document.getElementById('stateUnknown');
  var inbox = document.getElementById('stateInbox');
  var dict = window.FLOW_PAGE_I18N;

  function L() {
    return document.documentElement.lang === 'he' ? 'he' : 'en';
  }
  function fill(template, email) {
    var safe = String(email).replace(/[&<>"']/g, function (ch) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
    });
    return template.replace('{email}', '<bdi>' + safe + '</bdi>');
  }
  function paint() {
    var lang = L();
    document.getElementById('connectedTitle').innerHTML = fill(dict.connectedAs[lang], address);
    document.getElementById('inboxBody').innerHTML = fill(dict.inboxBody[lang], address);
    var hint = document.getElementById('magicHint');
    if (hint && !hint.hidden) hint.textContent = dict.invalid[lang];
  }
  function show(next) {
    state = next;
    connected.hidden = next !== 'connected';
    unknown.hidden = next !== 'unknown';
    inbox.hidden = next !== 'inbox';
    paint();
  }
  document.getElementById('connectAll').addEventListener('click', function () {
    root.querySelectorAll('[data-eco]').forEach(function (box) { box.checked = true; });
  });
  var form = document.getElementById('magicForm');
  var input = document.getElementById('magicEmail');
  var hint = document.getElementById('magicHint');
  var submit = document.getElementById('magicSubmit');
  function refreshMagic() {
    var value = (input.value || '').trim();
    var valid = EMAIL_RE.test(value);
    submit.disabled = !valid;
    var bad = value.length > 0 && !valid;
    hint.hidden = !bad;
    if (bad) hint.textContent = dict.invalid[L()];
    input.setAttribute('aria-invalid', bad ? 'true' : 'false');
  }
  input.addEventListener('input', refreshMagic);
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var value = (input.value || '').trim();
    if (!EMAIL_RE.test(value)) { refreshMagic(); input.focus(); return; }
    address = value;
    show('inbox');
  });
  new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  show(state);
};
</script>
<script src="/glance/gate.js" defer></script>
<script src="/assets/site-nav.js" defer></script>
</body>
</html>
