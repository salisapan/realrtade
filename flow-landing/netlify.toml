# Static landing page. The only build step packages the Glance extension
# into the confirmed-signup download. The site's "Base directory" in
# Netlify is flow-landing, so this command runs here and the script walks
# up to the repo root for flow-trial-extension/. Publishing "." still
# deploys this folder as-is. See flow-trial-extension/docs/SETUP.md.
[build]
  command = "python3 ../scripts/package_trial_extension.py"
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

# The handler reads flow-trial-extension.zip via __dirname. The default
# esbuild bundler does not ship that file, and node_bundler = "none"
# only ships the handler plus included_files — not the rest of the
# directory. The path is relative to this folder (the Netlify base).
[functions."download-trial-zip"]
  node_bundler = "none"
  included_files = ["netlify/functions/download-trial-zip/flow-trial-extension.zip"]

# send-playbook attaches the Playbook PDF by reading it from disk. The default
# esbuild bundler ships only what the handler imports, so without this the
# deployed function could not find the PDF and every confirmed Flow waitlist
# signup would get "Attachment unavailable" instead of the Playbook it was promised.
[functions."send-playbook"]
  node_bundler = "none"
  included_files = ["netlify/functions/send-playbook/hybrid-automation-playbook.pdf"]

# Permanent redirects for pages that were removed, merged or moved to Insights
# (2026-10-28). Each old URL is covered with and without the .html suffix.
