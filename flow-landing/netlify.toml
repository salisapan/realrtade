# Static landing page. The only build step packages the Glance extension
# into the confirmed-signup download. The site's "Base directory" in
# Netlify is flow-landing, so this command runs here and the script walks
# up to the repo root for flow-trial-extension/. Publishing "." still
# deploys this folder as-is. See flow-trial-extension/docs/SETUP.md.
#
# Redirects and headers match the live deploy 6aff8715. The live file is a
# Netlify CLI resolved config (absolute /tmp/corrected paths, *Origin keys,
# no build command). Those CLI-only keys stay out. This [build] is the repo
# layout so a git publish still packages the extension.
plugins = []

[build]
  command = "python3 ../scripts/package_trial_extension.py"
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

# The handler reads flow-trial-extension.zip via __dirname. The default
# esbuild bundler does not ship that file, and node_bundler = "none"
# only ships the handler plus included_files — not the rest of the
# directory. The path is relative to this folder (the Netlify base).
[functions."download-trial-zip"]
  node_bundler = "none"
  included_files = [
    "netlify/functions/download-trial-zip/flow-trial-extension.zip",
  ]

# send-playbook attaches the Playbook PDF by reading it from disk. The default
# esbuild bundler ships only what the handler imports, so without this the
# deployed function could not find the PDF and every confirmed Flow waitlist
# signup would get "Attachment unavailable" instead of the Playbook it was promised.
[functions."send-playbook"]
  node_bundler = "none"
  included_files = [
    "netlify/functions/send-playbook/hybrid-automation-playbook.pdf",
  ]

[[headers]]
  for = "/*"

  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://zjquktirlrhbqcnkfaok.supabase.co https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://*.clarity.ms https://c.bing.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

