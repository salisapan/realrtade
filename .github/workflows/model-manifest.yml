# Builds the pinned manifests (file sizes and SHA-256 at an exact commit) for the two candidate on-device models, on GitHub's runner, because
# the development sandbox's network policy refuses huggingface.co. Public data only; nothing is uploaded anywhere but the job log and artifact.
# Runs on a push that touches this file; manual runs otherwise. docs/hybrid-execution-architecture.md.
name: Model manifest

on:
  push:
    paths:
      - .github/workflows/model-manifest.yml
      - scripts/hybrid/build-model-manifest.cjs
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: mlc-ai/Phi-3-mini-4k-instruct-q4f16_1-MLC
            lib: Phi-3-mini-4k-instruct-q4f16_1_cs1k-webgpu.wasm
          - repo: mlc-ai/Llama-3-8B-Instruct-q4f16_1-MLC
            lib: Llama-3-8B-Instruct-q4f16_1_cs1k-webgpu.wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/hybrid/build-model-manifest.cjs ${{ matrix.repo }} ${{ matrix.lib }} /tmp/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ strategy.job-index }}
          path: /tmp/manifest.json

  # The manifests are the trust root of the download (what each file must hash to), so they are put into the repo by this job, from the
  # builder's own output, and not typed in by hand. A push by the Actions token does not start another workflow run.
  commit:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: /tmp/m
      - run: |
          mkdir -p flow-trial-extension/core/model-manifests
          for f in /tmp/m/*/manifest.json; do
            id=$(node -p "require('$f').id")
            cp "$f" "flow-trial-extension/core/model-manifests/$id.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow-trial-extension/core/model-manifests
          git diff --cached --quiet && exit 0
          git commit -m "Pinned model manifests (file sizes and SHA-256 at an exact commit), built by scripts/hybrid/build-model-manifest.cjs"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
