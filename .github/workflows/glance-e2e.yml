name: Glance headless E2E

# TEMP baseline v2: Playwright-only sharded run on 551da01b (no jsdom corpora).
on:
  pull_request:
    branches:
      - claude/install-uiux-pro-max-skill-a4agox
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.tz }} shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - tz: UTC
            tz_slug: UTC
            shard: 1
          - tz: UTC
            tz_slug: UTC
            shard: 2
          - tz: UTC
            tz_slug: UTC
            shard: 3
          - tz: Asia/Jerusalem
            tz_slug: Asia-Jerusalem
            shard: 1
          - tz: Asia/Jerusalem
            tz_slug: Asia-Jerusalem
            shard: 2
          - tz: Asia/Jerusalem
            tz_slug: Asia-Jerusalem
            shard: 3
    env:
      TZ: ${{ matrix.tz }}
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flow-trial-extension/package-lock.json
      - name: Install dependencies
        working-directory: flow-trial-extension
        run: npm ci
      - name: Install Chromium
        working-directory: flow-trial-extension
        run: npx playwright install --with-deps chromium
      - name: Run the headless suite
        working-directory: flow-trial-extension
        run: xvfb-run -a npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-e2e-${{ matrix.tz_slug }}-shard-${{ matrix.shard }}
          path: |
            flow-trial-extension/e2e-report/
            flow-trial-extension/test-results/
          if-no-files-found: ignore
          retention-days: 7
