name: Glance headless E2E

on:
  pull_request:
    branches:
      - claude/install-uiux-pro-max-skill-a4agox
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.tz }})
    runs-on: ubuntu-latest
    # The suite runs about 20–22 minutes per matrix leg; 25m cancelled UTC mid-run (2026-10-26).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - tz: UTC
            artifact: glance-e2e-UTC
          - tz: Asia/Jerusalem
            artifact: glance-e2e-Asia-Jerusalem
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flow-trial-extension/package-lock.json
      - name: Install dependencies
        working-directory: flow-trial-extension
        run: npm ci
      - name: Run the jsdom regressions
        working-directory: flow-trial-extension
        run: |
          node test/mail-switch-race-corpus.cjs
          node test/cc-only-recipients-corpus.cjs
          node test/glance-0956-corpus.cjs
          node test/outlook-calendar-corpus.cjs
          node test/smoke227-meeting-ask-corpus.cjs
          node test/regress-144-corpus.cjs
          node test/negation-conditional-corpus.cjs
          node test/self-title-preposition-corpus.cjs
          node test/display-144-followups-corpus.cjs
      - name: Install Chromium
        working-directory: flow-trial-extension
        run: npx playwright install --with-deps chromium
      - name: Run the headless suite
        working-directory: flow-trial-extension
        run: xvfb-run -a npx playwright test
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            flow-trial-extension/e2e-report/
            flow-trial-extension/test-results/
          if-no-files-found: ignore
          retention-days: 7
