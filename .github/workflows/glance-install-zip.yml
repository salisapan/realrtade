name: Glance install zip

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package the extension and serve it through the download function
        run: python3 scripts/verify_trial_install.py
      - name: Outlook add-in, build the bundle and run its tests
        run: |
          node glance-outlook-addin/scripts/build-bundle.js
          node glance-outlook-addin/scripts/pack.js
          TZ=UTC node glance-outlook-addin/test/addin.test.cjs
          TZ=UTC node glance-outlook-addin/test/behavior.test.cjs
          TZ=Asia/Jerusalem node glance-outlook-addin/test/addin.test.cjs
          TZ=Asia/Jerusalem node glance-outlook-addin/test/behavior.test.cjs
