name: Glance install zip

on:
  push:
    branches: [main, release-approved]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "flow-trial-extension/**"
      - "glance-gmail-addon/**"
      - "scripts/package_trial_extension.py"
      - "scripts/verify_trial_install.py"
      - "flow-landing/netlify/functions/download-trial-zip/**"
      - ".github/workflows/glance-install-zip.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package the extension and serve it through the download function
        run: python3 scripts/verify_trial_install.py
