name: Glance install zip

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package the extension and serve it through the download function
        run: python3 scripts/verify_trial_install.py
      - name: Gmail add-on bundle and corpora
        run: |
          node glance-gmail-addon/scripts/check-core-bundle.cjs
          node glance-gmail-addon/test/v1.test.cjs
          node glance-gmail-addon/test/card-titles-corpus.cjs
          node glance-gmail-addon/test/build-stamp.test.cjs
          node flow-trial-extension/test/name-match-corpus.cjs
          node flow-trial-extension/test/docs-consistency-corpus.cjs
          node flow-trial-extension/test/outlook-graph-marker-corpus.cjs
          node flow-trial-extension/test/outlook-graph-marker-edge-corpus.cjs
          node flow-trial-extension/test/outlook-marker-judge-parity.cjs
