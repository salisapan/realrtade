name: Deploy Flow landing page

# Publishes flow-landing/ to GitHub Pages.
# One-time setup: repo Settings → Pages → "Build and deployment" → Source → "GitHub Actions".
# The site is then live at https://salisapan.github.io/realrtade/

on:
  push:
    branches:
      - main
      - claude/install-uiux-pro-max-skill-a4agox
    paths:
      - "flow-landing/**"
      - ".github/workflows/deploy-flow-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flow-landing
      - id: deployment
        uses: actions/deploy-pages@v4
