# Runs the pre-registered encoder-as-fallback experiment (docs/encoder-evaluation-plan.md) on GitHub's runner, because the
# development sandbox's network policy refuses huggingface.co. Public data only: the fixed corpus in the repo. The owner's private
# human set is gitignored and is NOT here, so this run judges the pooled sets without it (said in the plan and in the report).
# Nothing here ships anything or changes the product; it only prints numbers and uploads result.json.
# Run once (2026-10-04, result in docs/encoder-evaluation-plan.md section 6); manual runs only from now on.
name: Encoder experiment

on:
  workflow_dispatch:

jobs:
  encoder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy onnxruntime tokenizers huggingface_hub
      - name: Fixed corpus and training sentences
        run: |
          node scripts/intent/dump-features.cjs /tmp/fixed
          node scripts/intent/dump-fixed-corpus.cjs /tmp/fixed
      - name: Run the experiment
        run: python3 scripts/intent/nn/encoder-fallback-eval.py /tmp/fixed --model Xenova/multilingual-e5-small --out /tmp/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encoder-result
          path: /tmp/result.json
          if-no-files-found: ignore
