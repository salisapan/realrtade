# Diagnosis of the language model experiment (docs/lm-fallback-evaluation-plan.md section 6): all four models proposed almost nothing even
# with constrained decoding, which is more likely a defect in the harness than a fact about the models. This short run prints, for the first
# prompts, the sentence, what the model chose and its score for each act. Runs on a push that touches this file. Remove after use.
name: Language model diagnosis

on:
  push:
    paths:
      - .github/workflows/lm-diagnose.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        model:
          - Qwen/Qwen2.5-1.5B-Instruct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers numpy
      - run: |
          node scripts/intent/dump-features.cjs /tmp/fixed
          node scripts/intent/dump-fixed-corpus.cjs /tmp/fixed
          node scripts/intent/lm/collect-prompts.cjs /tmp/fixed
      - name: Ask the model (first 60 prompts, traced)
        run: python3 scripts/intent/lm/generate.py /tmp/fixed --model ${{ matrix.model }} --out /tmp/raw.json --limit 60 --trace 60
